name: One-shot P1 autofix

on:
  push:
    branches:
      - fix/foundational-contracts-20260831
    paths:
      - scripts/p1_autofix.py
      - .github/workflows/p1-autofix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundational-contracts-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Declare the one intentional duplicate baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          path = Path('scripts/p1_autofix.py')
          text = path.read_text(encoding='utf-8')
          start_marker = 'def replace_once(path: str, old: str, new: str) -> None:\n'
          end_marker = '\n\ndef sub_once(path: str, pattern: str, replacement: str) -> None:\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('replace_once helper boundary mismatch')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = textwrap.dedent('''
          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              intentional_duplicate = (
                  path == "src/App.tsx"
                  and "const previousDocumentId = documentRef.current.id" in old
                  and "await applyLoaded(loaded)" in old
              )
              if count != 1 and not (intentional_duplicate and count == 2):
                  raise RuntimeError(f"{path}: expected one literal match (or the declared two-site open block), found {count}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))
          ''').lstrip()
          path.write_text(text[:start] + replacement.rstrip() + text[end:], encoding='utf-8', newline='\n')
          PY
      - name: Apply asserted P1 patch
        run: python scripts/p1_autofix.py
      - name: Preserve legacy recovery visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src-tauri/src/commands.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<i>[ \t]*)if recovery_document_id\(&contents\)\.is_some\(\) \{\n'
              r'(?P=i)    if let Some\(key\) = recovery_key_from_path\(&path\) \{\n'
              r'(?P=i)        return Ok\(Some\(RecoveryPayload \{ key, contents \}\)\);\n'
              r'(?P=i)    \}\n'
              r'(?P=i)\}'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'legacy recovery semantic baseline mismatch: {len(matches)} matches')
          indent = matches[0].group('i')
          lines = [
              'if let Some(document_id) = recovery_document_id(&contents) {',
              '    let key = recovery_key_from_path(&path).or_else(|| {',
              '        (path.file_name().and_then(|value| value.to_str()) == Some("pending.dwrite"))',
              '            .then_some(document_id)',
              '    });',
              '    if let Some(key) = key {',
              '        return Ok(Some(RecoveryPayload { key, contents }));',
              '    }',
              '}',
          ]
          replacement = '\n'.join(indent + line for line in lines)
          text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit('legacy recovery replacement count changed unexpectedly')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit repaired contracts and remove one-shot tooling
        shell: bash
        run: |
          git rm -f scripts/p1_autofix.py .github/workflows/p1-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve known P1 writing contracts"
          git push origin HEAD:fix/foundational-contracts-20260831
