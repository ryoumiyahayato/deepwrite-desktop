name: One-shot P1 recovery restore fix

on:
  push:
    branches:
      - fix/foundational-contracts-20260831
    paths:
      - scripts/fix_p1_recovery_restore.py
      - .github/workflows/p1-recovery-restore-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundational-contracts-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact recovery repair
        run: python scripts/fix_p1_recovery_restore.py
      - name: Check patch
        run: git diff --check
      - name: Commit repair and remove one-shot tooling
        shell: bash
        run: |
          git rm -f scripts/fix_p1_recovery_restore.py .github/workflows/p1-recovery-restore-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve same-key recovery after restore"
          git push origin HEAD:fix/foundational-contracts-20260831
