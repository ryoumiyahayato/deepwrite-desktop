name: Apply final contract fixes

on:
  push:
    branches: [fix/foundational-contracts-20260831]
    paths:
      - '.github/workflows/apply-final-contract-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundational-contracts-20260831
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded repair
        run: python scripts/apply-final-contract-fixes.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Validate frontend and repository diff
        run: |
          git diff --check
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm validate:windows-bundle
          pnpm build
      - name: Remove one-shot tooling and commit
        run: |
          git rm -f scripts/apply-final-contract-fixes.py .github/workflows/apply-final-contract-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close final privacy and single-instance races'
          git push origin HEAD:fix/foundational-contracts-20260831
