name: Apply P2 integration

on:
  push:
    branches: [fix/foundational-contracts-20260831]
    paths:
      - '.github/workflows/apply-p2-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundational-contracts-20260831
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply guarded integration patch
        run: python scripts/apply-p2-integration.py
      - name: Refresh lockfiles
        run: |
          pnpm install --lockfile-only
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Validate text changes
        run: |
          git diff --check
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Remove one-shot tooling and commit
        run: |
          git rm -f scripts/apply-p2-integration.py .github/workflows/apply-p2-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close known P2 contracts and menu lifecycle'
          git push origin HEAD:fix/foundational-contracts-20260831
# retry after direct native toggle binding
