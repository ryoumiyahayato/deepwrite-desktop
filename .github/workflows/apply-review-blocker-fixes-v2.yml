name: Apply review blocker fixes v2

on:
  push:
    branches: [fix/foundational-contracts-20260831]
    paths:
      - '.github/workflows/apply-review-blocker-fixes-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundational-contracts-20260831
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded review fixes
        run: python scripts/apply-review-blocker-fixes.py
      - name: Complete React hook dependencies and recovery fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          replacements = [
              ('  }, [editor, refreshRecent]);', '  }, [editor, refreshRecent, updateSaveState]);'),
              ('  }, [commitDiscard, editor, prepareDocumentTransition]);', '  }, [commitDiscard, editor, prepareDocumentTransition, updateSaveState]);'),
              ('  }, [editor, snapshot]);', '  }, [editor, snapshot, updateSaveState]);'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one hook dependency match: {old!r}')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          test = Path('src/services/documentFiles.test.ts')
          text = test.read_text(encoding='utf-8')
          import_anchor = "import { describe, expect, it } from 'vitest';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('recovery test import anchor mismatch')
          text = text.replace(import_anchor, import_anchor + "import { createDocument, serializeDocument } from '../domain/document';\n", 1)
          start = text.index('    const valid = JSON.stringify({')
          end_marker = '    });\n    const recovered = firstValidRecovery(['
          end = text.index(end_marker, start)
          text = text[:start] + "    const valid = serializeDocument({ ...createDocument('可恢复'), id: 'doc-valid', revision: 1 });\n" + text[end + len('    });\n'):]
          test.write_text(text, encoding='utf-8')
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Validate frontend and diff
        run: |
          git diff --check
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm validate:windows-bundle
          pnpm build
      - name: Remove one-shot tooling and commit
        run: |
          git rm -f scripts/apply-review-blocker-fixes.py .github/workflows/apply-review-blocker-fixes.yml .github/workflows/apply-review-blocker-fixes-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close remaining review safety blockers'
          git push origin HEAD:fix/foundational-contracts-20260831
